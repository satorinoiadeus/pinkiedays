name: Build Pinkie Days APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PinkieDays-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PinkieDays-APK
          path: PinkieDays-1.1.0.apk
          if-no-files-found: error
